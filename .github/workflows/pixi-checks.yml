name: Pixi checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      SPY_WERROR: true

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        # default fetch-depth: 1, fast initial checkout

      - name: Fetch full commit history (no blobs)
        if: github.event_name == 'pull_request'
        run: git fetch --filter=blob:none --unshallow

      - name: Check uv.lock and pixi.lock changed together
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          UV_CHANGED=$(git diff --quiet $BASE_SHA -- uv.lock && echo no || echo yes)
          PIXI_CHANGED=$(git diff --quiet $BASE_SHA -- pixi.lock && echo no || echo yes)
          echo "uv.lock changed in this PR:   $UV_CHANGED"
          echo "pixi.lock changed in this PR: $PIXI_CHANGED"
          if [ "$UV_CHANGED" != "$PIXI_CHANGED" ]; then
            echo "::error::Only one of uv.lock/pixi.lock was modified in this PR. Run both 'pixi lock' and 'uv lock' and commit any resulting changes."
            exit 1
          fi

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.69.0
          cache: true

      - name: Build libspy
        run: |
          pixi run make-libspy

      - name: Check spy build -x
        run: |
          pixi run spy build -x examples/1_high_level/hello.spy

      - name: Build str_bytes.spy (links against libgc)
        run: |
          pixi run spy build examples/1_high_level/str_bytes.spy

      - name: Run str_bytes binary outside the pixi environment
        # Deliberately NOT wrapped in "pixi run": this is a plain shell step,
        # so none of pixi's activation env vars (in particular
        # DYLD_LIBRARY_PATH on macOS) are set. This is what actually happens
        # when a user runs a spy-built binary later, in a fresh shell/script,
        # rather than from inside "pixi run"/"pixi shell". It's the only way
        # to catch a missing rpath to libgc.
        run: |
          examples/1_high_level/build/str_bytes
