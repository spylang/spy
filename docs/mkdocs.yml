site_name: SPy
docs_dir: src
repo_url: https://github.com/spylang/spy
repo_name: spylang/spy
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: ['..']
  - pymdownx.inlinehilite
  - pymdownx.blocks.admonition
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      toc_depth: 3
  - def_list

hooks:
  - generate_reference.py
  - gen_example_pages.py

plugins:
  - mkdocs-typer2

nav:
  - Home: index.md
  - Tutorials:
    - tutorials/getting-started.md
    - Examples:
      - examples/1_high_level.md
      - examples/2_metaprogramming.md
      - examples/3_low_level.md
      - examples/4_advanced.md
  - How-to guides:
    - howto/main_function.md
    - howto/generics.md
  - Reference:
    - reference/python_builtins.md
    - reference/spy_builtin_functions.md
    - reference/builtin_types.md
    - reference/spy_module.md
    - reference/scoping.md
    - reference/cli.md
    - reference/environment.md
  - Explanation:
    - explanation/index.md
    - explanation/compilation-pipeline.md
    - explanation/low-level-memory.md
    - llwasm, the low-level WASM layer (AI-generated): explanation/llwasm.md
  - Contributing:
    - contributing/index.md
    - contributing/docs.md

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/spylang/spy
      name: SPy on GitHub
