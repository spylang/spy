    "python-fasthtml>=0.13.4",
    "spylang",
]

[tool.uv.sources]
spylang = { path = "../../..", editable = true }


[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest_pyodide==0.59.2",
]
